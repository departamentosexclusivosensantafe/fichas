<script>
  (function () {
    const images = ["https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_hero.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_2.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_3.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_4.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_5.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_6.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_7.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp40/caroProp40_8.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_1.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_2.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_3.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_4.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_5.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_6.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_7.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_8.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_9.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_10.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_11.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_12.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_13.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_14.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_15.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_16.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_17.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_18.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_19.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/Satori_Santafe/Satori_Santafe_20.jpeg"];
    let currentIndex = 0;

    const img = document.querySelector(".property__hero-image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const counter = document.getElementById("imageCounter");

    // Precargar todas las imágenes de la galería
    const preloadedImages = [];

    images.forEach((url) => {
      const preload = new Image();
      preload.src = url;
      preloadedImages.push(preload);
    });

    if (!img || !btnBack || !btnForward || images.length === 0) return;

    function updateSlider() {
        img.src = images[currentIndex];
      if (counter) {
        counter.textContent =
          (currentIndex + 1) + " / " + images.length;
      }
    }

    // 🔹 render inicial
    updateSlider();

    btnForward.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    });

    btnBack.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    });

    // Swipe support
    let startX = 0;
    let endX = 0;

    img.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
    });

    img.addEventListener("touchend", (e) => {
      endX = e.changedTouches[0].clientX;
      handleSwipe();
    });

    function handleSwipe() {
      const diff = startX - endX;

      // sensibilidad mínima
      if (Math.abs(diff) < 50) return;

      if (diff > 0) {
        // swipe izquierda → anterior
        currentIndex =
          (currentIndex - 1 + images.length) % images.length;

      } else {
        // swipe derecha → siguiente
        currentIndex = (currentIndex + 1) % images.length;
      }

      updateSlider();
    }

  })();

</script>

</body>
